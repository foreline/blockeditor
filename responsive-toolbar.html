<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BlockEditor — адаптивная панель</title>
    <style>
        body { margin: 24px; font: 16px/1.5 system-ui; background: #f5f7fa; color: #253044; }
        h1 { font-size: 24px; }
        .demo-frame { width: 1100px; max-width: 100%; box-sizing: border-box; margin-block: 20px; padding: 16px; border: 1px solid #d8dfe8; border-radius: 8px; background: white; }
        .secondary { width: 420px; }
        select { padding: 6px; font: inherit; }
    </style>
</head>
<body>
    <h1>Адаптивная панель BlockEditor</h1>
    <p>Меняйте ширину контейнера, выделяйте текст и пробуйте команды из меню.</p>
    <label>Ширина редактора <select id="width"><option value="1100">1100 px</option><option value="600">600 px</option><option value="360">360 px</option></select></label>
    <div class="demo-frame" id="frame"><div id="primary"></div></div>
    <h2>Второй редактор</h2>
    <div class="demo-frame secondary"><div id="secondary"></div></div>
    <script type="module">
        import './src/css/editor.css';
        import './src/css/content-defaults.css';
        import { Editor } from './src/Editor.js';
        Editor.mount(document.getElementById('primary'), {text: 'Выделите этот текст для проверки форматирования.', toolbar: {locale: 'ru'}, debug: false});
        Editor.mount(document.getElementById('secondary'), {text: 'Независимый редактор в узком контейнере.', toolbar: {locale: 'ru'}, debug: false});
        document.getElementById('width').addEventListener('change', event => {
            document.getElementById('frame').style.width = `${event.target.value}px`;
        });
    </script>
</body>
</html>
